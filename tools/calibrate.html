<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arduboy 3D 模型标定工具</title>
  <style>
    :root {
      --bg: #14161a; --panel: #1c1f26; --panel-2: #23262f; --line: #2e323d;
      --text: #e8e6df; --muted: #9a97a0; --amber: #f6b73c; --green: #4fc26e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; font-size: 13px; }
    #app { display: flex; height: 100%; }
    #side {
      width: 340px; min-width: 340px; background: var(--panel);
      border-right: 1px solid var(--line); padding: 14px;
      display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
    }
    h1 { font-size: 16px; color: var(--amber); }
    #status { color: var(--muted); font-size: 12px; }
    #step { font-weight: 700; color: var(--amber); }
    #hint { color: var(--muted); font-size: 12px; line-height: 1.8; }
    #log {
      flex: 1; min-height: 160px; overflow-y: auto; background: var(--bg);
      border: 1px solid var(--line); border-radius: 6px; padding: 8px;
      font-family: Consolas, monospace; font-size: 11px; color: var(--muted);
      white-space: pre-wrap; word-break: break-all;
    }
    .row { display: flex; gap: 8px; }
    button {
      flex: 1; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px;
      background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 12px;
    }
    button:hover:not(:disabled) { border-color: var(--amber); color: var(--amber); }
    button:disabled { opacity: 0.4; cursor: default; }
    #view { flex: 1; min-width: 0; display: block; }
  </style>
  <!-- Dev tool only — CDN is fine here; the app itself imports from the npm package. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <aside id="side">
      <h1>Arduboy 3D 模型标定</h1>
      <div id="status">正在加载 /model/model.glb …</div>
      <div id="step">第 1 / 10 步：点击屏幕左上角</div>
      <div id="hint">
        依次点击模型上的 10 个点：<br>
        1-4：屏幕四角（左上 → 右上 → 右下 → 左下）<br>
        5-10：按键中心（上 → 下 → 左 → 右 → A → B）<br>
        取点完成后点“导出 calibration.json”，保存为<br>
        src/config/calibration.json（覆盖默认占位文件）。<br>
        操作：左键拖动旋转 · 右键拖动平移 · 滚轮缩放。
      </div>
      <div class="row">
        <button id="btnExport" disabled>导出 calibration.json</button>
      </div>
      <div class="row">
        <button id="btnDefaults">回退默认值</button>
        <button id="btnClear">清空重来</button>
      </div>
      <div id="log"></div>
    </aside>
    <canvas id="view"></canvas>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const view = document.getElementById('view');
    const stepEl = document.getElementById('step');
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const btnExport = document.getElementById('btnExport');
    const btnDefaults = document.getElementById('btnDefaults');
    const btnClear = document.getElementById('btnClear');

    const renderer = new THREE.WebGLRenderer({ canvas: view, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x14161a);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 5000);
    camera.position.set(40, 24, 40);
    const controls = new OrbitControls(camera, view);
    controls.enableDamping = true;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x2e323d, 1.1));
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(5, 8, 6);
    scene.add(key);
    const grid = new THREE.GridHelper(100, 20, 0x2e323d, 0x22252c);
    grid.position.y = -25;
    scene.add(grid);

    const raycaster = new THREE.Raycaster();
    let pickTargets = []; // GLB meshes only — markers/edges must not be pickable

    function log(msg) { logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; }
    function setStatus(msg) { statusEl.textContent = msg; log(msg); }

    function setStepText(msg) { stepEl.textContent = msg; }
    function showStep(n) {
      if (n < STEPS.length) setStepText(`第 ${n + 1} / ${STEPS.length} 步：点击${STEPS[n].label}`);
    }

    // ---- workflow: 4 screen corners, then 6 button centers ----------------
    const STEPS = [
      { kind: 'screen', label: '屏幕左上角' },
      { kind: 'screen', label: '屏幕右上角' },
      { kind: 'screen', label: '屏幕右下角' },
      { kind: 'screen', label: '屏幕左下角' },
      { kind: 'button', label: '上键 (UP) 中心', key: 'up' },
      { kind: 'button', label: '下键 (DOWN) 中心', key: 'down' },
      { kind: 'button', label: '左键 (LEFT) 中心', key: 'left' },
      { kind: 'button', label: '右键 (RIGHT) 中心', key: 'right' },
      { kind: 'button', label: 'A 键中心', key: 'a' },
      { kind: 'button', label: 'B 键中心', key: 'b' },
    ];
    const picks = []; // {label, kind, key, point, normal}

    // ---- numbered markers --------------------------------------------------
    const markers = new THREE.Group();
    scene.add(markers);

    function makeLabel(text) {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const g = c.getContext('2d');
      g.fillStyle = '#fff';
      g.font = 'bold 42px sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(text, 32, 34);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
      sp.scale.set(4, 4, 1);
      return sp;
    }

    function addMarker(i, p, color) {
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(0.7, 16, 12),
        new THREE.MeshBasicMaterial({ color })
      );
      m.position.copy(p);
      const label = makeLabel(String(i + 1));
      label.position.copy(p);
      markers.add(m, label);
    }

    function clearPicks() {
      markers.clear();
      picks.length = 0;
      showStep(0);
      btnExport.disabled = true;
    }

    // ---- picking -----------------------------------------------------------
    // World-space face normal, oriented toward the camera (outward from the
    // visible surface).
    function faceNormal(hit) {
      const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld).normalize();
      if (n.dot(camera.position.clone().sub(hit.point)) < 0) n.negate();
      return n;
    }

    function recordPoint(hit) {
      const step = STEPS[picks.length];
      const point = hit.point.clone();
      const normal = faceNormal(hit);
      picks.push({ ...step, point, normal });
      addMarker(picks.length - 1, point, step.kind === 'screen' ? 0xf6b73c : 0x4fc26e);
      log(`#${picks.length} ${step.label}: (${point.x.toFixed(2)}, ${point.y.toFixed(2)}, ${point.z.toFixed(2)}) 法向 (${normal.x.toFixed(2)}, ${normal.y.toFixed(2)}, ${normal.z.toFixed(2)})`);
      if (picks.length < STEPS.length) showStep(picks.length);
      else {
        setStepText('已取满 10 点 — 可导出');
        btnExport.disabled = false;
      }
    }

    // Click = pick; drag = orbit (ignore picks after pointer movement).
    let downXY = null;
    view.addEventListener('pointerdown', (e) => { downXY = [e.clientX, e.clientY]; });
    view.addEventListener('pointerup', (e) => {
      if (!downXY) return;
      const moved = Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]);
      downXY = null;
      if (moved > 5 || picks.length >= STEPS.length) return;
      if (!pickTargets.length) { log('模型未加载，无法取点'); return; }
      const ndc = new THREE.Vector2(
        (e.clientX / view.clientWidth) * 2 - 1,
        -(e.clientY / view.clientHeight) * 2 + 1
      );
      raycaster.setFromCamera(ndc, camera);
      const hits = raycaster.intersectObjects(pickTargets, false);
      if (!hits.length) { log('未命中模型，请点击模型表面'); return; }
      recordPoint(hits[0]);
    });

    // ---- JSON build + export ------------------------------------------------
    const r3 = (x) => Math.round(x * 100) / 100;
    const v3 = (n) => ({ x: r3(n.x), y: r3(n.y), z: r3(n.z) });

    function buildJSON() {
      const c = picks.slice(0, 4).map((p) => p.point);
      const a = c[0], b = c[1], d = c[3]; // TL, TR, BL
      const u = b.clone().sub(a);
      const v = d.clone().sub(a);
      const n = u.clone().cross(v).normalize();
      const center = a.clone().add(b).add(c[2]).add(d).multiplyScalar(0.25);
      if (n.dot(camera.position.clone().sub(center)) < 0) n.negate();
      const w = (u.length() + c[2].distanceTo(d)) / 2;
      const h = (v.length() + c[2].distanceTo(b)) / 2;
      const screen = { x: r3(center.x), y: r3(center.y), z: r3(center.z), normal: v3(n), w: r3(w), h: r3(h) };
      const buttons = {};
      for (const p of picks.slice(4)) {
        buttons[p.key] = {
          x: r3(p.point.x), y: r3(p.point.y), z: r3(p.point.z),
          normal: v3(p.normal), depth: 1.0, meshName: null,
        };
      }
      return {
        _comment: 'generated by tools/calibrate.html — save as src/config/calibration.json',
        screen, buttons,
      };
    }

    btnExport.addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(buildJSON(), null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'calibration.json';
      a.click();
      URL.revokeObjectURL(a.href);
      log('已导出 calibration.json — 保存为 src/config/calibration.json');
    });

    // Same values as the default src/config/calibration.json (placeholders).
    btnDefaults.addEventListener('click', () => {
      clearPicks();
      const n = new THREE.Vector3(0, 0, 1);
      const corners = [
        new THREE.Vector3(-13, 6.5, 0), new THREE.Vector3(13, 6.5, 0),
        new THREE.Vector3(13, -6.5, 0), new THREE.Vector3(-13, -6.5, 0),
      ];
      const btnPos = {
        up: new THREE.Vector3(0, -20, 0), down: new THREE.Vector3(0, -20, 0),
        left: new THREE.Vector3(0, -20, 0), right: new THREE.Vector3(0, -20, 0),
        a: new THREE.Vector3(14, -16, 0), b: new THREE.Vector3(26, -16, 0),
      };
      STEPS.slice(0, 4).forEach((s, i) => {
        picks.push({ ...s, point: corners[i], normal: n.clone() });
        addMarker(i, corners[i], 0xf6b73c);
      });
      STEPS.slice(4).forEach((s, i) => {
        picks.push({ ...s, point: btnPos[s.key], normal: n.clone() });
        addMarker(4 + i, btnPos[s.key], 0x4fc26e);
      });
      setStepText('已填入默认占位值 — 可导出（数值需实测替换）');
      btnExport.disabled = false;
      log('已填入默认值（与 src/config/calibration.json 相同）');
    });

    btnClear.addEventListener('click', () => {
      clearPicks();
      log('已清空所有取点');
    });

    // ---- model load + camera fit ---------------------------------------------
    new GLTFLoader().loadAsync('/model/model.glb')
      .then((gltf) => {
        const box = new THREE.Box3().setFromObject(gltf.scene);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const fit = 40 / maxDim;
        gltf.scene.scale.setScalar(fit);
        gltf.scene.position.copy(center).multiplyScalar(-fit);
        gltf.scene.traverse((o) => { if (o.isMesh) pickTargets.push(o); });
        scene.add(gltf.scene);
        const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
        const dist = Math.max(20 / tanHalf, 20 / (tanHalf * camera.aspect)) * 1.2;
        camera.position.set(dist * 0.6, dist * 0.35, dist);
        camera.near = Math.max(0.1, dist * 0.05);
        camera.far = dist * 10;
        camera.updateProjectionMatrix();
        controls.target.set(0, 0, 0);
        grid.position.y = -23;
        setStatus('模型已加载 — 按左侧提示依次取点');
      })
      .catch(() => setStatus('未找到 /model/model.glb — 请先把 STEP 转成 GLB 放到 model/ 目录（见 tools/convert_model.md）'));

    function resize() {
      const w = view.clientWidth || 1;
      const h = view.clientHeight || 1;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
